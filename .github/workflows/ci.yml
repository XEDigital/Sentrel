name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Product, binary and package names live here and in scripts/build.sh
# (the defaults there match). Change them in both places when renaming.
env:
  PRODUCT_TITLE: Sentrel
  AGENT_BIN: sentrel-agent
  SERVER_BIN: sentrel-server
  NFPM_VERSION: v2.41.3
  COSIGN_VERSION: v2.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    # Build and test only; publishing happens in the release job below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web dependencies and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: go vet ./...
      - run: go test ./...
      - name: Install msitools (MSI builder)
        run: sudo apt-get update && sudo apt-get install -y msitools wixl
      - name: Build release artifacts and packages
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then VERSION="0.0.0-${GITHUB_SHA::8}"; fi
          scripts/build.sh --skip-web --packages --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    # Runs only for version tags, with the write and signing permissions the
    # build job does not get.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # keyless cosign signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Sign checksums
        env:
          SENTREL_RELEASE_KEY: ${{ secrets.SENTREL_RELEASE_KEY }}
        run: |
          if [ -z "$SENTREL_RELEASE_KEY" ]; then
            echo "SENTREL_RELEASE_KEY is not set; skipping the Ed25519 checksum signature (cosign still signs SHA256SUMS)"
            exit 0
          fi
          go run ./cmd/sentrel-sign sign -key env:SENTREL_RELEASE_KEY dist/SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign checksums with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.cosign.bundle \
            dist/SHA256SUMS
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: SBOMs (SPDX, one per binary)
        run: |
          for f in dist/${AGENT_BIN}-* dist/${SERVER_BIN}-*; do
            case "$f" in *.deb|*.rpm|*.msi) continue ;; esac
            syft "file:$f" -o "spdx-json=$f.spdx.json"
          done
          ls dist/*.spdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          # Release notes are this version's CHANGELOG section.
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then NOTES="--notes-file notes.md"; else NOTES="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" --title "Sentrel $GITHUB_REF_NAME" $NOTES $PRE dist/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
